apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskmanager.fullname" . }}-stats
  labels:
    {{- include "taskmanager.labels" (dict "root" . "component" "stats") | nindent 4 }}
spec:
  replicas: {{ .Values.stats.replicaCount }}
  selector:
    matchLabels:
      {{- include "taskmanager.selectorLabels" (dict "root" . "component" "stats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskmanager.labels" (dict "root" . "component" "stats") | nindent 8 }}
      annotations:
        # Зміна ConfigMap або Secret призводить до перезапуску подів.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: stats
          image: "{{ .Values.stats.image.repository }}:{{ .Values.stats.image.tag }}"
          imagePullPolicy: {{ .Values.stats.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.stats.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "taskmanager.fullname" . }}-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskmanager.fullname" . }}-secret
                  key: MONGO_URI
          resources:
            {{- toYaml .Values.stats.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
