# Значення за замовчуванням відповідають середовищу розробки.

nameOverride: ""
fullnameOverride: ""

api:
  replicaCount: 1
  image:
    repository: taskmanager-api
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 5000
  service:
    type: NodePort
    port: 5000
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi

stats:
  replicaCount: 1
  image:
    repository: taskmanager-stats
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  containerPort: 5001
  service:
    type: ClusterIP
    port: 5001
    nodePort: null
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi

mongo:
  replicaCount: 1
  image:
    repository: mongo
    tag: "7"
    pullPolicy: IfNotPresent
  service:
    port: 27017
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: false
  className: nginx
  host: taskmanager.local

# Нечутливі параметри застосунку (потрапляють у ConfigMap).
config:
  mongoDb: taskmanager
  logLevel: info

# Чутливі параметри (потрапляють у Secret).
# Це навчальний пароль для розробки. Для prod пароль передається через --set.
secret:
  mongoRootUsername: taskmanager_admin
  mongoRootPassword: dev-only-password
