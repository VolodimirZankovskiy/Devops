apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskmanager.fullname" . }}-config
  labels:
    {{- include "taskmanager.labels" (dict "root" . "component" "config") | nindent 4 }}
data:
  MONGO_DB: {{ .Values.config.mongoDb | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
