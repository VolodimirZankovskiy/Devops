apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "taskmanager.fullname" . }}-mongo
  labels:
    {{- include "taskmanager.labels" (dict "root" . "component" "mongo") | nindent 4 }}
spec:
  replicas: {{ .Values.mongo.replicaCount }}
  # Том ReadWriteOnce: стара копія має зупинитися до запуску нової.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "taskmanager.selectorLabels" (dict "root" . "component" "mongo") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "taskmanager.labels" (dict "root" . "component" "mongo") | nindent 8 }}
    spec:
      containers:
        - name: mongo
          image: "{{ .Values.mongo.image.repository }}:{{ .Values.mongo.image.tag }}"
          imagePullPolicy: {{ .Values.mongo.image.pullPolicy }}
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskmanager.fullname" . }}-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "taskmanager.fullname" . }}-secret
                  key: MONGO_ROOT_PASSWORD
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          resources:
            {{- toYaml .Values.mongo.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: mongo-data
          {{- if .Values.mongo.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "taskmanager.fullname" . }}-mongo
          {{- else }}
          emptyDir: {}
          {{- end }}
