{{- if .Values.mongo.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "taskmanager.fullname" . }}-mongo
  labels:
    {{- include "taskmanager.labels" (dict "root" . "component" "mongo") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.mongo.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mongo.persistence.size }}
{{- end }}
