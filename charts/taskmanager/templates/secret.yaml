apiVersion: v1
kind: Secret
metadata:
  name: {{ include "taskmanager.fullname" . }}-secret
  labels:
    {{- include "taskmanager.labels" (dict "root" . "component" "secret") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: {{ required "secret.mongoRootUsername is required" .Values.secret.mongoRootUsername | quote }}
  MONGO_ROOT_PASSWORD: {{ required "secret.mongoRootPassword is required: pass it with --set secret.mongoRootPassword=..." .Values.secret.mongoRootPassword | quote }}
  MONGO_URI: {{ printf "mongodb://%s:%s@%s-mongo:%d/?authSource=admin" (urlquery .Values.secret.mongoRootUsername) (urlquery .Values.secret.mongoRootPassword) (include "taskmanager.fullname" .) (int .Values.mongo.service.port) | quote }}