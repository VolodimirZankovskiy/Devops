apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskmanager.fullname" . }}-stats
  labels:
    {{- include "taskmanager.labels" (dict "root" . "component" "stats") | nindent 4 }}
spec:
  type: {{ .Values.stats.service.type }}
  selector:
    {{- include "taskmanager.selectorLabels" (dict "root" . "component" "stats") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.stats.service.port }}
      targetPort: http
      {{- if and (eq .Values.stats.service.type "NodePort") .Values.stats.service.nodePort }}
      nodePort: {{ .Values.stats.service.nodePort }}
      {{- end }}
