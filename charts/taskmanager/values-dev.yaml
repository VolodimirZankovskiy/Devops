# Середовище розробки: мінімум реплік і ресурсів, без Ingress.
api:
  replicaCount: 1
  image:
    tag: "1.0.0"
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi

stats:
  replicaCount: 1
  image:
    tag: "1.0.0"
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: false
