apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: taskmanager-zankovskiy
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          # Образ зібраний локально і завантажений в minikube командою
          # `minikube image load taskmanager-api:1.0.0` — тому реєстр не
          # використовується, і pull-policy = Never (беремо з локального
          # сховища образів вузла, а не намагаємось тягнути з інтернету).
          image: taskmanager-api:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: taskmanager-config
          env:
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: taskmanager-secret
                  key: MONGO_URI
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
